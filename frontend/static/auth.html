<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - RPG IA</title>

    <link rel="stylesheet" href="../css/paleta_1.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<main class="container">

    <section class="banner" aria-labelledby="titulo-banner">
        <h1 id="titulo-banner">🛡 Crie sua Conta</h1>
        <p>
            Prepare-se para iniciar uma aventura única.
        </p>
    </section>

    <section class="formulario" aria-labelledby="titulo-cadastro">

        <h2 id="titulo-cadastro">Cadastro</h2>

        <form aria-labelledby="titulo-cadastro">

            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" type="text" placeholder="Digite seu nome" autocomplete="name">
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Digite seu email" autocomplete="email">
            </div>

            <div class="campo">
                <label for="genero">Gênero</label>
                <select id="genero">
                    <option selected disabled>Selecione</option>
                    <option>Masculino</option>
                    <option>Feminino</option>
                    <option>Não Informar</option>
                    <option>Outro</option>
                </select>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input id="senha" type="password" placeholder="Crie uma senha" autocomplete="new-password">
            </div>

            <div class="campo">
                <label for="confirmar-senha">Confirmar Senha</label>
                <input id="confirmar-senha" type="password" placeholder="Repita sua senha" autocomplete="new-password">
            </div>

            <button type="submit">Cadastrar</button>

        </form>

        <p class="link">
            Já possui conta?
            <a href="login.html">Entrar</a>
        </p>

    </section>

</main>

</body>
</html>
