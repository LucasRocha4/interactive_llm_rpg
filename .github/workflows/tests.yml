name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: sqlite:///db.sqlite3
      GEMINI_API_KEY: fake-key-used-only-by-mocked-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python llm_interactive_rpg/manage.py test tests --verbosity 2
      - name: Validate rules JSON
        run: python llm_interactive_rpg/app/regras/validar.py
